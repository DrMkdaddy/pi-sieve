<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="pi-sieve logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111216"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="amber" x1="24" y1="24" x2="104" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Obsidian squircle badge -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" stroke="#242429" stroke-width="2"/>

  <!-- Coarse input bars (top, muted) entering the sieve plane -->
  <rect x="28" y="26" width="20" height="8" rx="4" fill="#52525b"/>
  <rect x="54" y="26" width="20" height="8" rx="4" fill="#f4f3ee" opacity="0.85"/>
  <rect x="80" y="26" width="20" height="8" rx="4" fill="#52525b"/>

  <!-- Sieve frame: tapered precision funnel + calibrated aperture bar -->
  <path d="M24 44 H104 L82 68 H46 Z" fill="none" stroke="url(#amber)" stroke-width="3" stroke-linejoin="round"/>
  <line x1="36" y1="56" x2="92" y2="56" stroke="#fb923c" stroke-width="2" stroke-dasharray="6 6" opacity="0.7"/>

  <!-- Clean routed signal streams exiting below -->
  <path d="M54 68 V88 C54 94, 44 96, 38 96" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 68 V100" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
  <path d="M74 68 V88 C74 94, 84 96, 90 96" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round"/>

  <!-- Filtered signal terminal nodes -->
  <circle cx="38" cy="96" r="4.5" fill="#60a5fa"/>
  <circle cx="64" cy="100" r="5" fill="#34d399"/>
  <circle cx="90" cy="96" r="4.5" fill="#fb923c"/>
</svg>
